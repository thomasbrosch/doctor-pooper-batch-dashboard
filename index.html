<style>
:root {
  --bg: #f7f5f2;
  --bg-card: #ffffff;
  --bg-row-alt: #f2efeb;
  --bg-expand: #eae6e0;
  --text: #1a2332;
  --text-secondary: #5c6370;
  --text-muted: #8a8f99;
  --border: #d8d3cc;
  --border-light: #e8e4de;
  --accent: #2a8f82;
  --accent-hover: #237a6f;
  --green: #2d9b4e;
  --green-bg: #e8f5ec;
  --amber: #b8860b;
  --amber-bg: #fdf3e0;
  --red: #c44536;
  --red-bg: #fce8e6;
  --purple: #6b5b95;
  --purple-bg: #f0ecf5;
  --tag-active: #2d9b4e;
  --tag-active-bg: #e8f5ec;
  --tag-inactive: #b8860b;
  --tag-inactive-bg: #fdf3e0;
  --tag-archived: #8a8f99;
  --tag-archived-bg: #eeeef0;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-heading: 'Source Serif 4', Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a24;
    --bg-card: #1a2332;
    --bg-row-alt: #1e2a3a;
    --bg-expand: #243244;
    --text: #e2e5ea;
    --text-secondary: #9aa3b0;
    --text-muted: #6b7280;
    --border: #2d3a4d;
    --border-light: #253040;
    --accent: #3db5a5;
    --accent-hover: #4fc9b9;
    --green: #4aba6a;
    --green-bg: #1a2f22;
    --amber: #d4a030;
    --amber-bg: #2a2518;
    --red: #e05c4d;
    --red-bg: #2f1c1a;
    --purple: #9180c4;
    --purple-bg: #1f1a30;
    --tag-active: #4aba6a;
    --tag-active-bg: #1a2f22;
    --tag-inactive: #d4a030;
    --tag-inactive-bg: #2a2518;
    --tag-archived: #6b7280;
    --tag-archived-bg: #1e2530;
  }
}
:root[data-theme="dark"] {
  --bg: #131a24;
  --bg-card: #1a2332;
  --bg-row-alt: #1e2a3a;
  --bg-expand: #243244;
  --text: #e2e5ea;
  --text-secondary: #9aa3b0;
  --text-muted: #6b7280;
  --border: #2d3a4d;
  --border-light: #253040;
  --accent: #3db5a5;
  --accent-hover: #4fc9b9;
  --green: #4aba6a;
  --green-bg: #1a2f22;
  --amber: #d4a030;
  --amber-bg: #2a2518;
  --red: #e05c4d;
  --red-bg: #2f1c1a;
  --purple: #9180c4;
  --purple-bg: #1f1a30;
  --tag-active: #4aba6a;
  --tag-active-bg: #1a2f22;
  --tag-inactive: #d4a030;
  --tag-inactive-bg: #2a2518;
  --tag-archived: #6b7280;
  --tag-archived-bg: #1e2530;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

header {
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
header h1 {
  font-family: var(--font-heading);
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
header .date-range {
  font-size: 0.8125rem;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

/* Summary tiles */
.summary-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.tile {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 16px 18px;
}
.tile-label {
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.tile-value {
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.tile-sub {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* Filter bar */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-bar label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-right: 4px;
}
.filter-btn {
  font-family: var(--font-body);
  font-size: 0.8125rem;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.sort-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.sort-bar label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.sort-select {
  font-family: var(--font-body);
  font-size: 0.8125rem;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-card);

Ad-001-Static-CM-Batch-287.1-Search-Solution Static", "as": "08/29/26__#287__DFC - Search-Solution Static", "p": "DFC", "d": "not_delivering", "s": 2.15, "pu": 0, "r": 0.0, "cpa": null, "imp": 60, "cr": "-", "qr": "-", "er": "-", "lc": 1, "ctr": 1.67, "lv": 0, "cv": 0, "atc": 0, "v25": null, "v50": null, "v75": null, "v95": null, "v100": null, "tp": null, "ctp": null, "apt": "00:00:00", "hv": false}, {"n": "Ad-003-Static-CM-Batch-287.3-Search-Solution Static", "as": "08/29/26__#287__DFC - Search-Solution Static", "p": "DFC", "d": "not_delivering", "s": 0.0, "pu": 0, "r": 0.0, "cpa": null, "imp": 0, "cr": "-", "qr": "-", "er": "-", "lc": 0, "ctr": 0.0, "lv": 0, "cv": 0, "atc": 0, "v25": null, "v50": null, "v75": null, "v95": null, "v100": null, "tp": null, "ctp": null, "apt": "00:00:00", "hv": false}, {"n": "Ad-002-Static-CM-Batch-287.2-Search-Solution Static", "as": "08/29/26__#287__DFC - Search-Solution Static", "p": "DFC", "d": "inactive", "s": 451.47, "pu": 1, "r": 0.1428, "cpa": 451.47, "imp": 12863, "cr": "Average", "qr": "Average", "er": "Below average - Bottom 35% of ads", "lc": 90, "ctr": 0.99, "lv": 65, "cv": 67, "atc": 3, "v25": null, "v50": null, "v75": null, "v95": null, "v100": null, "tp": null, "ctp": null, "apt": "00:00:00", "hv": false}]};
const ADSETS = DATA.adsets;
const ADS = DATA.ads;

// Build lookup: adset name -> ads
const adsByAdset = {};
ADS.forEach(ad => {
  if (!adsByAdset[ad.as]) adsByAdset[ad.as] = [];
  adsByAdset[ad.as].push(ad);
});

// Sort ads within each adset by spend desc
Object.values(adsByAdset).forEach(arr => arr.sort((a, b) => b.s - a.s));

let currentFilter = 'all';
let currentStatus = 'all';
let currentSort = 'spend-desc';
let expandedSets = new Set();

function fmt(n) {
  if (n == null) return '—';
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtInt(n) {
  if (n == null) return '—';
  return n.toLocaleString('en-US');
}
function fmtPct(n) {
  if (n == null) return '—';
  return n.toFixed(2) + '%';
}

function roasClass(r, product) {
  if (!r || r === 0) return 'na';
  // DFC target: $60 CPA / 0.8-1.0 ROAS; DFK target: $40 CPA
  if (r >= 1.0) return 'good';
  if (r >= 0.6) return 'warn';
  return 'bad';
}

function cpaClass(cpa, product) {
  if (cpa == null) return 'na';
  const target = product === 'DFK' ? 40 : 60;
  if (cpa <= target) return 'good';
  if (cpa <= target * 1.5) return 'warn';
  return 'bad';
}

function deliveryLabel(d) {
  const map = { active: 'Active', inactive: 'Off', archived: 'Archived', not_delivering: 'Paused' };
  return map[d] || d;
}

function getFiltered() {
  let list = ADSETS;
  if (currentFilter !== 'all') list = list.filter(a => a.product === currentFilter);
  if (currentStatus === 'with-spend') list = list.filter(a => a.spend > 0);
  if (currentStatus === 'active') list = list.filter(a => a.delivery === 'active');
  return sortList(list);
}

function sortList(list) {
  const [field, dir] = currentSort.split('-');
  const mult = dir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => {
    let va, vb;
    if (field === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); return va < vb ? -mult : va > vb ? mult : 0; }
    if (field === 'spend') { va = a.spend; vb = b.spend; }
    if (field === 'roas') { va = a.roas || 0; vb = b.roas || 0; }
    if (field === 'cpa') { va = a.cpa || 99999; vb = b.cpa || 99999; }
    if (field === 'purchases') { va = a.purchases; vb = b.purchases; }
    return (va - vb) * mult;
  });
}

function updateSummary() {
  const filtered = getFiltered();
  const totalSpend = filtered.reduce((s, a) => s + a.spend, 0);
  const totalPurchases = filtered.reduce((s, a) => s + a.purchases, 0);
  const withSpend = filtered.filter(a => a.spend > 0);
  const avgRoas = totalSpend > 0 ? filtered.reduce((s, a) => s + (a.roas * a.spend), 0) / totalSpend : 0;
  const avgCpa = totalPurchases > 0 ? totalSpend / totalPurchases : 0;

  document.getElementById('summary').innerHTML = `
    <div class="tile">
      <div class="tile-label">Ad Sets</div>
      <div class="tile-value">${filtered.length}</div>
      <div class="tile-sub">${withSpend.length} with spend</div>
    </div>
    <div class="tile">
      <div class="tile-label">Total Spend</div>
      <div class="tile-value">$${fmtInt(Math.round(totalSpend))}</div>
    </div>
    <div class="tile">
      <div class="tile-label">Total Purchases</div>
      <div class="tile-value">${fmtInt(totalPurchases)}</div>
    </div>
    <div class="tile">
      <div class="tile-label">Blended ROAS</div>
      <div class="tile-value ${roasClass(avgRoas)}">${avgRoas.toFixed(2)}×</div>
    </div>
    <div class="tile">
      <div class="tile-label">Blended CPA</div>
      <div class="tile-value ${cpaClass(avgCpa, currentFilter)}">${avgCpa > 0 ? '$' + fmt(avgCpa) : '—'}</div>
    </div>
  `;
}

function renderList() {
  const filtered = getFiltered();
  const container = document.getElementById('adsetList');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">No ad sets match the current filters.</div>';
    return;
  }

  container.innerHTML = filtered.map((a, i) => {
    const isExpanded = expandedSets.has(a.name);
    const ads = adsByAdset[a.name] || [];
    const hasAds = ads.length > 0;
    const noPurchases = a.purchases === 0 && a.spend > 0;

    // Short name: strip date prefix pattern
    let shortName = a.name.replace(/^\d{1,2}\/\d{1,2}\/\d{2}__/, '').replace(/^0?\d\/\d{1,2}\/\d{2}__/, '');

    return `
      <div class="adset-row ${isExpanded ? 'expanded' : ''} ${a.spend === 0 ? 'no-purchases' : ''}" data-name="${a.name}">
        <div class="adset-header" tabindex="0" role="button" aria-expanded="${isExpanded}" onclick="toggleAdset('${a.name.replace(/'/g, "\\'")}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleAdset('${a.name.replace(/'/g, "\\'")}');}">
          <div class="expand-icon">${hasAds ? '▶' : ''}</div>
          <div class="adset-name" title="${a.name}">
            <span class="product-tag ${a.product.toLowerCase()}">${a.product}</span>
            ${shortName}
          </div>
          <div class="metric">${a.spend > 0 ? '$' + fmt(a.spend) : '—'}</div>
          <div class="metric ${a.purchases > 0 ? '' : (a.spend > 0 ? 'na' : 'secondary')}">${a.purchases > 0 ? fmtInt(a.purchases) : (a.spend > 0 ? '0' : '—')}</div>
          <div class="metric ${roasClass(a.roas, a.product)}">${a.roas > 0 ? a.roas.toFixed(2) + '×' : '—'}</div>
          <div class="metric hide-mobile ${cpaClass(a.cpa, a.product)}">${a.cpa ? '$' + fmt(a.cpa) : '—'}</div>
          <div class="metric secondary hide-mobile">${a.cpm > 0 ? '$' + fmt(a.cpm) : '—'}</div>
          <div class="delivery-tag">
            <span class="status-dot ${a.delivery}"></span>
            ${deliveryLabel(a.delivery)}
          </div>
        </div>
        ${isExpanded && hasAds ? renderAdDetail(ads, a) : ''}
      </div>
    `;
  }).join('');
}

function renderAdDetail(ads, adset) {
  const hasVideo = ads.some(a => a.hv);

  return `
    <div class="adset-detail">
      <div class="section-tabs">
        <button class="section-tab active" onclick="switchTab(this, 'perf', '${adset.name.replace(/'/g, "\\'")}')">Performance</button>
        <button class="section-tab" onclick="switchTab(this, 'funnel', '${adset.name.replace(/'/g, "\\'")}')">Funnel</button>
        ${hasVideo ? `<button class="section-tab" onclick="switchTab(this, 'video', '${adset.name.replace(/'/g, "\\'")}')">Video</button>` : ''}
        <button class="section-tab" onclick="switchTab(this, 'quality', '${adset.name.replace(/'/g, "\\'")}')">Quality</button>
      </div>
      <div class="ad-table-wrap">
        ${renderPerfTable(ads, adset)}
      </div>
    </div>
  `;
}

function renderPerfTable(ads, adset) {
  return `<table class="ad-table" data-view="perf">
    <thead><tr>
      <th style="min-width:200px">Ad</th>
      <th>Status</th>
      <th>Spend</th>
      <th>Purchases</th>
      <th>ROAS</th>
      <th>CPA</th>
      <th>Impressions</th>
      <th>Recommendation</th>
    </tr></thead>
    <tbody>${ads.map(a => {
      const rec = getRecommendation(a, adset);
      return `<tr>
        <td title="${a.n}">${shortAdName(a.n)}</td>
        <td><div class="ad-delivery"><span class="status-dot ${a.d}"></span>${deliveryLabel(a.d)}</div></td>
        <td>${a.s > 0 ? '$' + fmt(a.s) : '—'}</td>
        <td>${a.pu > 0 ? fmtInt(a.pu) : (a.s > 0 ? '0' : '—')}</td>
        <td class="${roasClass(a.r, adset.product)}">${a.r > 0 ? a.r.toFixed(2) + '×' : '—'}</td>
        <td class="${cpaClass(a.cpa, adset.product)}">${a.cpa ? '$' + fmt(a.cpa) : '—'}</td>
        <td>${a.imp > 0 ? fmtInt(a.imp) : '—'}</td>
        <td><span class="rank-badge ${rec.cls}">${rec.label}</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderFunnelTable(ads) {
  return `<table class="ad-table" data-view="funnel">
    <thead><tr>
      <th style="min-width:200px">Ad</th>
      <th>Link Clicks</th>
      <th>CTR</th>
      <th>Landing Views</th>
      <th>Content Views</th>
      <th>Add to Cart</th>
      <th>Purchases</th>
      <th>Click→Purchase</th>
    </tr></thead>
    <tbody>${ads.map(a => {
      const convRate = a.lc > 0 && a.pu > 0 ? ((a.pu / a.lc) * 100).toFixed(1) + '%' : '—';
      return `<tr>
        <td title="${a.n}">${shortAdName(a.n)}</td>
        <td>${a.lc > 0 ? fmtInt(a.lc) : '—'}</td>
        <td>${a.ctr > 0 ? a.ctr.toFixed(2) + '%' : '—'}</td>
        <td>${a.lv > 0 ? fmtInt(a.lv) : '—'}</td>
        <td>${a.cv > 0 ? fmtInt(a.cv) : '—'}</td>
        <td>${a.atc > 0 ? fmtInt(a.atc) : '—'}</td>
        <td>${a.pu > 0 ? fmtInt(a.pu) : '—'}</td>
        <td>${convRate}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderVideoTable(ads) {
  const videoAds = ads.filter(a => a.hv);
  if (videoAds.length === 0) return '<div class="empty-state">No video ads in this ad set.</div>';

  return `<table class="ad-table" data-view="video">
    <thead><tr>
      <th style="min-width:200px">Ad</th>
      <th>ThruPlays</th>
      <th>$/ThruPlay</th>
      <th>Avg Play</th>
      <th>25%</th>
      <th>50%</th>
      <th>75%</th>
      <th>95%</th>
      <th>100%</th>
      <th>Retention</th>
    </tr></thead>
    <tbody>${videoAds.map(a => {
      const retention = a.v25 > 0 ? ((a.v100 / a.v25) * 100).toFixed(0) : 0;
      return `<tr>
        <td title="${a.n}">${shortAdName(a.n)}</td>
        <td>${a.tp ? fmtInt(a.tp) : '—'}</td>
        <td>${a.ctp ? '$' + fmt(a.ctp) : '—'}</td>
        <td>${a.apt && a.apt !== '00:00:00' ? a.apt.replace(/^0+:?/, '') : '—'}</td>
        <td>${a.v25 ? fmtInt(a.v25) : '—'}</td>
        <td>${a.v50 ? fmtInt(a.v50) : '—'}</td>
        <td>${a.v75 ? fmtInt(a.v75) : '—'}</td>
        <td>${a.v95 ? fmtInt(a.v95) : '—'}</td>
        <td>${a.v100 ? fmtInt(a.v100) : '—'}</td>
        <td>${retention > 0 ? retention + '%' : '—'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderQualityTable(ads) {
  return `<table class="ad-table" data-view="quality">
    <thead><tr>
      <th style="min-width:200px">Ad</th>
      <th>Conversion Rank</th>
      <th>Quality Rank</th>
      <th>Engagement Rank</th>
    </tr></thead>
    <tbody>${ads.filter(a => a.s > 0).map(a => `<tr>
        <td title="${a.n}">${shortAdName(a.n)}</td>
        <td>${rankBadge(a.cr)}</td>
        <td>${rankBadge(a.qr)}</td>
        <td>${rankBadge(a.er)}</td>
      </tr>`).join('')}</tbody>
  </table>`;
}

function rankBadge(rank) {
  if (!rank || rank === '-') return '<span class="rank-badge na">—</span>';
  if (rank.includes('Above')) return '<span class="rank-badge above">Above avg</span>';
  if (rank.includes('Below')) return '<span class="rank-badge below">Below avg</span>';
  return '<span class="rank-badge average">Average</span>';
}

function getRecommendation(ad, adset) {
  if (ad.s === 0) return { label: 'No spend', cls: 'na' };
  if (ad.pu === 0 && ad.s >= 100) return { label: 'Cut', cls: 'below' };
  if (ad.pu === 0) return { label: 'Watching', cls: 'na' };
  // For DFC: target CPA $60, for DFK: $40
  const target = adset.product === 'DFK' ? 40 : 60;
  if (ad.cpa && ad.cpa <= target && ad.r >= 0.8) return { label: 'Lead ad', cls: 'above' };
  if (ad.cpa && ad.cpa <= target * 1.2) return { label: 'Keep', cls: 'above' };
  if (ad.r >= 0.6) return { label: 'Watch', cls: 'average' };
  if (ad.cpa && ad.cpa > target * 2.5) return { label: 'Cut', cls: 'below' };
  return { label: 'Watch', cls: 'average' };
}

function shortAdName(name) {
  // Trim long prefixes for readability
  let short = name
    .replace(/^Ad-\d+-/, '')
    .replace(/^Static__/, '⬜ ')
    .replace(/^Video__/, '▶ ')
    .replace(/-20260827$/, '')
    .replace(/^(DFC|DFK|DCM)-/, '$1 ');
  if (short.length > 55) short = short.substring(0, 52) + '…';
  return short;
}

function toggleAdset(name) {
  if (expandedSets.has(name)) expandedSets.delete(name);
  else expandedSets.add(name);
  renderList();
}

function switchTab(btn, view, adsetName) {
  const detail = btn.closest('.adset-detail');
  detail.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const ads = adsByAdset[adsetName] || [];
  const adset = ADSETS.find(a => a.name === adsetName);
  const wrap = detail.querySelector('.ad-table-wrap');

  if (view === 'perf') wrap.innerHTML = renderPerfTable(ads, adset);
  else if (view === 'funnel') wrap.innerHTML = renderFunnelTable(ads);
  else if (view === 'video') wrap.innerHTML = renderVideoTable(ads);
  else if (view === 'quality') wrap.innerHTML = renderQualityTable(ads);
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-bar [data-filter]').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  updateSummary();
  renderList();
}

function setStatus(s) {
  currentStatus = s;
  document.querySelectorAll('.status-filter [data-status]').forEach(b => b.classList.toggle('active', b.dataset.status === s));
  updateSummary();
  renderList();
}

function changeSort(v) {
  currentSort = v;
  renderList();
}

// Init
updateSummary();
renderList();
</script>
